
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vue.js Hello World</title>
</head>
<body>

    <div id="app">
        <h1>{{ message }}</h1>
    </div>

    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    message: 'Hello World!'
                };
            }
        }).mount('#app');
    </script>

</body>
</html>
